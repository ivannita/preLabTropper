<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Tienda Bizcocho: Contacto</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html"
          ><img src="../img/bizcochosinfondo.png" alt="logo" width="90px"
        /></a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
          <li><a href="./carrito.html">Carrito</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="pages">
        <h1 class="titulo-pages text-dark">Contactanos</h1>
        <form
          class="div-pages"
          action="https://formspree.io/f/xeaerbbw"
          method="post"
        >
          <div class="grupo-input">
            <label for="email">Tu dirección de correo:</label>
            <input id="email" type="email" name="email" />
          </div>
          <div class="grupo-input">
            <label for="mensaje">Dejanos tu mensaje:</label>
            <textarea name="mensaje" id="mensaje"></textarea>
          </div>
          <button class="btn bg-primary text-dark">Enviar</button>
        </form>
      </section>
    </main>
    <footer>
      <p>
        Sitio realizado por Ivanna Tropper para el curso Front - End JS (Talento
        Tech)
      </p>
      <nav>
        <ul class="footer-list">
          <li>
            <img src="../img/whatsapp.png" alt="logo whatsapp" />
            <img src="../img/social.png" alt="logo instagram" />
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
