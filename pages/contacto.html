<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <div class="div-logo"><a class="logo" href="../index.html">LOGO</a></div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
          <li><a href="./carrito.html">Carrito</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!--https://formspree.io/f/xeaerbbw*/-->
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>
        <form
          class="form-contacto"
          action="https://formspree.io/f/xeaerbbw"
          method="post"
        >
          <div class="grupo-input">
            <label for="email">Tu dirección de correo:</label>
            <input id="email" type="email" name="email" />
          </div>
          <div class="grupo-input">
            <label for="mensaje">Dejanos tu mensaje:</label>
            <textarea name="mensaje" id="mensaje"></textarea>
          </div>
          <button class="btn bg-secondary text-dark">Enviar</button>
        </form>
      </section>
    </main>

    <footer></footer>
  </body>
